name: Rust-adapter

on:
  push:
    branches: [ "main" ]
    paths:
      - 'adapter/ph/**'
      - 'adapter/cli/**'
      - 'zpr-ext/**'
      - 'cslab/**'
      - 'cbpf-rs/**'
      - 'libnode2/**'
      - 'integration-test/**'
      - 'zpr/**'
      - '.github/workflows/adapter.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'adapter/ph/**'
      - 'adapter/cli/**'
      - 'zpr-ext/**'
      - 'cslab/**'
      - 'cbpf-rs/**'
      - 'libnode2/**'
      - 'integration-test/**'
      - 'zpr/**'
      - '.github/workflows/adapter.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  VISA_SERVICE_RELEASE: v0.19.0-rc.1

jobs:
  # Build and upload ph
  # windows-latest included (zipline#132): ph's default feature set builds on
  # Windows — io-uring is a Linux-target-gated dependency, so defaults are
  # portable. Verified by the msvc cross-check quoted in the PR.
  build-ph:
    name: PH
    uses: mkolehmainen/zl-zpr-dev-tools/.github/workflows/rust-build-test.yml@v1.5
    with:
      name: 'ph'
      path: './adapter/ph'
      package: true
      package-path: './target/debug/ph'
      runs-on: "['ubuntu-latest', 'macos-latest', 'windows-latest']"
      needs-capnp: true
    secrets: inherit

  # Build and upload ph-cli
  build-ph-cli:
    name: PH CLI
    uses: mkolehmainen/zl-zpr-dev-tools/.github/workflows/rust-build-test.yml@v1.5
    with:
      name: 'ph-cli'
      path: './adapter/cli'
      package: true
      package-path: './target/debug/ph-cli'
      runs-on: "['ubuntu-latest']"
      needs-libpcap: true
      needs-capnp: true
    secrets: inherit

  # Build and upload ph-cli on Windows (zipline#132). Separate job call so the
  # Linux job above stays byte-identical: on Windows the pcap default feature
  # is off (--no-default-features, plan D13) and libpcap is not installed.
  build-ph-cli-windows:
    name: PH CLI
    uses: mkolehmainen/zl-zpr-dev-tools/.github/workflows/rust-build-test.yml@v1.5
    with:
      name: 'ph-cli'
      path: './adapter/cli'
      package: true
      package-path: './target/debug/ph-cli'
      runs-on: "['windows-latest']"
      needs-capnp: true
      no-default-features: true
    secrets: inherit

  # Test ph, check for warnings, and check formatting
  test-ph:
    name: PH
    needs: [build-ph]
    uses: mkolehmainen/zl-zpr-dev-tools/.github/workflows/rust-test.yml@v1.5
    with:
      name: 'ph'
      path: './adapter/ph'
      runs-on: "['ubuntu-latest', 'macos-latest', 'windows-latest']"
      needs-capnp: true
    secrets: inherit

  # Test ph-cli, check for warnings, and check formatting
  test-ph-cli:
    name: PH CLI
    needs: [build-ph-cli]
    uses: mkolehmainen/zl-zpr-dev-tools/.github/workflows/rust-test.yml@v1.5
    with:
      name: 'ph-cli'
      path: './adapter/cli'
      runs-on: "['ubuntu-latest']"
      needs-libpcap: true
      needs-capnp: true
    secrets: inherit

  # Test ph-cli on Windows (zipline#132); pairs with build-ph-cli-windows.
  test-ph-cli-windows:
    name: PH CLI
    needs: [build-ph-cli-windows]
    uses: mkolehmainen/zl-zpr-dev-tools/.github/workflows/rust-test.yml@v1.5
    with:
      name: 'ph-cli'
      path: './adapter/cli'
      runs-on: "['windows-latest']"
      needs-capnp: true
      no-default-features: true
    secrets: inherit

  # Integration tests
  basic-integration-test:
    name: Run 1-Node Test (v6)
    needs: [build-ph, build-ph-cli]
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    # see <https://github.com/docker-library/golang/issues/452>
    - name: Set workspace as safe
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"
        go env -w GOPRIVATE="github.com/org-zpr/*"

    - uses: actions/download-artifact@v8
      with:
        pattern: ph-*${{ matrix.os }}
        merge-multiple: true

    - name: Build
      timeout-minutes: 10
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        tar -xvf ph.tar
        tar -xvf ph-cli.tar

    - name: Download Asset
      uses: robinraju/release-downloader@v1
      with:
        repository: 'mkolehmainen/zl-zpr-visaservice'
        tag: ${{ env.VISA_SERVICE_RELEASE }}
        fileName: 'release-linux-x86_64.tar.gz'
        extract: true
        out-file-path: 'integration-test'
        token: ${{ secrets.ZPR_CICD_RO_TOKEN }}

    - name: Set env
      run: |
        echo "DEBUG_TARGETS=all=DEBUG" >> $GITHUB_ENV

    - name: Install valkey
      timeout-minutes: 5
      run: |
        sudo apt-get update
        sudo apt install -y valkey
        sudo systemctl stop valkey-server
        sudo systemctl disable valkey-server

    - name: One Node v6 Test
      timeout-minutes: 10
      run: |
        ZPR_TEST_VERBOSE=1 VALKEY_SERVER_BIN=/usr/bin/valkey-server integration-test/one-node-v6-test.sh

  oidc-integration-test:
    name: Run 1-Node OIDC Test
    needs: [build-ph, build-ph-cli]
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    # see <https://github.com/docker-library/golang/issues/452>
    - name: Set workspace as safe
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"
        go env -w GOPRIVATE="github.com/org-zpr/*"

    - uses: actions/download-artifact@v8
      with:
        pattern: ph-*${{ matrix.os }}
        merge-multiple: true

    - name: Build
      timeout-minutes: 10
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        tar -xvf ph.tar
        tar -xvf ph-cli.tar

    - name: Download Asset
      uses: robinraju/release-downloader@v1
      with:
        repository: 'mkolehmainen/zl-zpr-visaservice'
        tag: ${{ env.VISA_SERVICE_RELEASE }}
        fileName: 'release-linux-x86_64.tar.gz'
        extract: true
        out-file-path: 'integration-test'
        token: ${{ secrets.ZPR_CICD_RO_TOKEN }}

    - name: Set env
      run: |
        echo "DEBUG_TARGETS=all=DEBUG" >> $GITHUB_ENV

    - name: Install valkey
      timeout-minutes: 5
      run: |
        sudo apt-get update
        sudo apt install -y valkey
        sudo systemctl stop valkey-server
        sudo systemctl disable valkey-server

    - name: One Node OIDC Test
      timeout-minutes: 10
      run: |
        ZPR_TEST_VERBOSE=1 VALKEY_SERVER_BIN=/usr/bin/valkey-server integration-test/one-node-oidc-test.sh

  oidc-renewal-integration-test:
    name: Run 1-Node OIDC Renewal Test
    needs: [build-ph, build-ph-cli]
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    # see <https://github.com/docker-library/golang/issues/452>
    - name: Set workspace as safe
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"
        go env -w GOPRIVATE="github.com/org-zpr/*"

    - uses: actions/download-artifact@v8
      with:
        pattern: ph-*${{ matrix.os }}
        merge-multiple: true

    - name: Build
      timeout-minutes: 10
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        tar -xvf ph.tar
        tar -xvf ph-cli.tar

    - name: Download Asset
      uses: robinraju/release-downloader@v1
      with:
        repository: 'mkolehmainen/zl-zpr-visaservice'
        tag: ${{ env.VISA_SERVICE_RELEASE }}
        fileName: 'release-linux-x86_64.tar.gz'
        extract: true
        out-file-path: 'integration-test'
        token: ${{ secrets.ZPR_CICD_RO_TOKEN }}

    - name: Set env
      run: |
        echo "DEBUG_TARGETS=all=DEBUG" >> $GITHUB_ENV

    - name: Install valkey
      timeout-minutes: 5
      run: |
        sudo apt-get update
        sudo apt install -y valkey
        sudo systemctl stop valkey-server
        sudo systemctl disable valkey-server

    - name: One Node OIDC Renewal Test
      timeout-minutes: 25
      run: |
        ZPR_TEST_VERBOSE=1 VALKEY_SERVER_BIN=/usr/bin/valkey-server integration-test/one-node-oidc-renewal-test.sh

  # Policy-install re-authentication e2e (zipline#124): same harness shape as
  # the OIDC renewal job above. Dormant on this fork (Actions disabled); the
  # netns/Docker run quoted in the PR is the gate here.
  policy-reauth-integration-test:
    name: Run 1-Node Policy Reauth Test
    needs: [build-ph, build-ph-cli]
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    # see <https://github.com/docker-library/golang/issues/452>
    - name: Set workspace as safe
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"
        go env -w GOPRIVATE="github.com/org-zpr/*"

    - uses: actions/download-artifact@v8
      with:
        pattern: ph-*${{ matrix.os }}
        merge-multiple: true

    - name: Build
      timeout-minutes: 10
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        tar -xvf ph.tar
        tar -xvf ph-cli.tar

    - name: Download Asset
      uses: robinraju/release-downloader@v1
      with:
        repository: 'mkolehmainen/zl-zpr-visaservice'
        tag: ${{ env.VISA_SERVICE_RELEASE }}
        fileName: 'release-linux-x86_64.tar.gz'
        extract: true
        out-file-path: 'integration-test'
        token: ${{ secrets.ZPR_CICD_RO_TOKEN }}

    - name: Set env
      run: |
        echo "DEBUG_TARGETS=all=DEBUG" >> $GITHUB_ENV

    - name: Install valkey
      timeout-minutes: 5
      run: |
        sudo apt-get update
        sudo apt install -y valkey
        sudo systemctl stop valkey-server
        sudo systemctl disable valkey-server

    - name: One Node Policy Reauth Test
      timeout-minutes: 25
      run: |
        ZPR_TEST_VERBOSE=1 VALKEY_SERVER_BIN=/usr/bin/valkey-server integration-test/one-node-policy-reauth-test.sh

  capture-integration-test:
    name: Run Capture Test
    needs: [build-ph, build-ph-cli]
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    # see <https://github.com/docker-library/golang/issues/452>
    - name: Set workspace as safe
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"
        go env -w GOPRIVATE="github.com/org-zpr/*"

    - uses: actions/download-artifact@v8
      with:
        pattern: ph-*${{ matrix.os }}
        merge-multiple: true

    - name: Build
      timeout-minutes: 10
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        tar -xvf ph.tar
        tar -xvf ph-cli.tar  

    - name: Download Asset
      uses: robinraju/release-downloader@v1
      with:
        repository: 'mkolehmainen/zl-zpr-visaservice'
        tag: ${{ env.VISA_SERVICE_RELEASE }}
        fileName: 'release-linux-x86_64.tar.gz'
        extract: true
        out-file-path: 'integration-test'
        token: ${{ secrets.ZPR_CICD_RO_TOKEN }}

    - name: Install valkey
      timeout-minutes: 5
      run: |
        sudo apt-get update
        sudo apt install -y valkey
        sudo systemctl stop valkey-server
        sudo systemctl disable valkey-server

    - name: Set env
      run: |
        echo "DEBUG_TARGETS=all=DEBUG" >> $GITHUB_ENV

    - name: Capture Test
      timeout-minutes: 10
      run: |
        ZPR_TEST_VERBOSE=1 VALKEY_SERVER_BIN=/usr/bin/valkey-server integration-test/capture-test.sh
