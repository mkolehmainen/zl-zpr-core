[package]
name = "ph"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
build-info = { path = "../../build-info" }
admin-api = { path = "../admin-api" }
aws-lc-rs = { workspace = true }
arrayref = { version = "0.3.7" }
base64 = "0.22.1"
blake3 = { version = "1.5.4" }
bytes = { version = "1.11.1" }
capnp = { workspace = true }
capnp-rpc = { workspace = true }
cbpf-rs = { workspace = true }
chrono = "0.4.39"
clap = { workspace = true, features = ["env"] }
clap_complete = { workspace = true, optional = true }
cslab = { git = "https://github.com/mkolehmainen/zl-zpr-utils.git", tag = "cslab-v0.1.2" }
curve25519-dalek = "4.1.3"
dashmap = { version = "6.0.1" }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "alloc"] }
enum-map = { version = "2.7.3" }
enumset = "1.1.5"
hdrhistogram = { version = "7.5.4" }
ip4sum = { workspace = true }
ipnet = { workspace = true }
itertools = "0.14"
libc = { version = "0.2.183" }
libnode = { package = "libnode2", path = "../../libnode2" }
open-enum = { version = "0.5.1" }
pkcs8 = "0.11"
rcu = { git = "https://github.com/mkolehmainen/zl-zpr-utils.git", tag = "rcu-v0.1.2", default-features = false }
replace_with = "0.1.8"
reqwest = { version = "0.13.1", features = ["json", "query"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
snow = "0.10.0"
socket2 = { version = "0.5.7", features = ["all"] }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = "0.9.11"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2.5.4"
x25519-dalek = { version = "3.0.0", features = ["getrandom", "reusable_secrets"] }
x509-cert = { workspace = true, features = ["builder"] }
zerocopy = { version = "0.8.3", features = ["derive", "std"] }
zpr = { workspace = true }
zpr-ext = { workspace = true, features = ["bytes", "tokio", "socket2", "zerocopy"] }
zpr-utils = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7.4", optional = true }
tokio-tun = { version = "0.11.5" }

[target.'cfg(unix)'.dependencies]
# Unix-only (fds, poll, uids): every use site lives in a cfg(unix) module
# (zipline#131 step 6).
nix = { version = "0.29.0", features = ["fs", "ioctl", "net", "poll", "uio", "user"] }
# FD-passing admin RPC transport (zipline#142): unix-only, enabled by the
# capnp-ancillary feature. Needs the capnproto-rust fork — see the
# [patch.crates-io] comment in the workspace root Cargo.toml.
capnp-futures = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Safe bindings that load the signed wintun.dll at runtime; the DLL ships
# next to ph.exe (plan D4).
wintun = "0.5"
# Raw Win32 for the Event-based Notify, the WaitForMultipleObjects WaitSet
# arm, the WSAEventSelect socket waitable, and named-pipe DACLs (plan D3/D6).
windows-sys = { version = "0.61", features = [
    "Win32_System_Threading",
    "Win32_Networking_WinSock",
    "Win32_Security",
    # WSAIoctl (SIO_UDP_CONNRESET at substrate bind, zipline#160) is gated
    # behind Win32_System_IO (its OVERLAPPED parameter); declared here
    # rather than inherited through feature unification.
    "Win32_System_IO",
    # GetUnicastIpAddressEntry: add_address waits out the DAD tentative
    # state of a fresh address (zipline#162); the row type needs Ndis.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }

[dev-dependencies]
futures = "0.3.31"
# TLS holding-server test helper (zipline#113): same versions libnode2 uses,
# so no new crates enter the build graph.
rcgen = "0.14.7"
rustls = "0.23.36"
serial_test = "4.0"
tokio-rustls = "0.26.4"
tokio = { workspace = true, features = ["test-util"] }

[features]
default = ["io-uring", "rcu-crossbeam-epoch", "capnp-ancillary"]
# FD passing for `setCaptureFile` over the admin RPC. The dependency lives in
# [target.'cfg(unix)'.dependencies], so on Windows the feature is a no-op; code
# is gated on cfg(all(unix, feature = "capnp-ancillary")). A mainline-capnp
# build must delete this feature and the optional capnp-futures dependency —
# see the [patch.crates-io] comment in the workspace root Cargo.toml.
capnp-ancillary = ["dep:capnp-futures", "capnp-futures/tokio-unix-fd-stream"]
ci = []
enable-security-testing = []
rcu-aarc = ["rcu/rcu-aarc", "zpr/rcu-aarc"]
rcu-arc-swap = ["rcu/rcu-arc-swap", "zpr/rcu-arc-swap"]
rcu-crossbeam-epoch = ["rcu/rcu-crossbeam-epoch", "zpr/rcu-crossbeam-epoch"]
rcu-mutex-arc = ["rcu/rcu-mutex-arc", "zpr/rcu-mutex-arc"]
rcu-rwlock = ["rcu/rcu-rwlock", "zpr/rcu-rwlock"]
complete = ["clap_complete"]
fuzzing = []

[[bin]]
name = "ph"
path = "src/main.rs"

[[bin]]
name = "generate_completions"
path = "src/generate_completions.rs"
required-features = ["complete"]

[lints.rust]
# Keeps a mainline-capnp build (capnp-ancillary feature deleted per the D4
# recipe in the root Cargo.toml) warning-free: check-cfg keeps the cfg a
# known value after the feature is gone.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"capnp-ancillary\"))"] }
