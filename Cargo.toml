# zpr-core
[workspace]
resolver = "3"
members = ["adapter/admin-api", "adapter/ph", "adapter/cli", "libnode2", "fuzz", "build-info"]

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
aws-lc-rs = "1.17"
capnp = { version = "0.26", features = ["sync_reader"] }
capnp-futures = "0.26"
capnp-rpc = "0.26"
cbpf-rs = { git = "https://github.com/mkolehmainen/zl-zpr-utils.git", tag = "cbpf-rs-v0.2.0" }
clap = { version = "4.5.23", features = ["derive"] }
clap_complete = "4.5.57"
ip4sum = "0.1.0"
ipnet = "2.11.0"
pcap = "2.0.0"
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["rt", "compat"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
x509-cert = "0.3.0"
zpr = { git = "https://github.com/mkolehmainen/zl-zpr-common.git", tag = "v0.30.0", features = ["vsapi", "policy"] }
zpr-ext = { git = "https://github.com/mkolehmainen/zl-zpr-utils.git", tag = "zpr-ext-v0.6.0" }
zpr-utils = { git = "https://github.com/mkolehmainen/zl-zpr-utils.git", tag = "zpr-utils-v0.2.3" }

[profile.release]
panic = "abort"

# Cap'n Proto FD-passing fork (zipline#140/#142, org-zpr#1399).
#
# Why: `ph-cli capture set-file` hands the capture file descriptor to `ph`
# over the admin RPC (`setCaptureFile`), which needs ancillary-data (SCM_RIGHTS)
# FD passing that crates.io capnp 0.26 does not have. The fork is emilazy's
# capnproto-rust PR #666 work plus our fixes; its maintenance rules live in
# ZIPLINE.md on the fork's `zipline` branch:
# https://github.com/mkolehmainen/capnproto-rust/blob/zipline/ZIPLINE.md
#
# The patch applies to every target, and the fork MUST build on every target
# (Windows included) — Cargo cannot scope a [patch] to unix. Only the FD-passing
# *use* is gated, on cfg(all(unix, feature = "capnp-ancillary")).
#
# Building against mainline capnp (no FD capture) takes TWO edits, not one:
#   1. delete this [patch.crates-io] block;
#   2. in adapter/ph/Cargo.toml and adapter/cli/Cargo.toml, delete the
#      `capnp-ancillary` feature (and remove it from `default`) and the
#      optional `capnp-futures` dependency it enables.
# `--no-default-features` alone is NOT enough: crates.io capnp-futures declares
# no features, so any manifest naming `capnp-futures/tokio-unix-fd-stream`
# fails resolution against mainline.
#
# After changing this block, re-resolve the lockfile onto the fork with
#   cargo update -p capnp -p capnp-futures -p capnp-rpc -p capnpc
# Without it, Cargo keeps the registry entries already in Cargo.lock and only
# warns `patch ... was not used in the crate graph`.
[patch.crates-io]
capnp = { git = "https://github.com/mkolehmainen/capnproto-rust.git", rev = "1e1d5ad692b4b2c2b942f04f32550df6445f4216" }
capnp-futures = { git = "https://github.com/mkolehmainen/capnproto-rust.git", rev = "1e1d5ad692b4b2c2b942f04f32550df6445f4216" }
capnp-rpc = { git = "https://github.com/mkolehmainen/capnproto-rust.git", rev = "1e1d5ad692b4b2c2b942f04f32550df6445f4216" }
capnpc = { git = "https://github.com/mkolehmainen/capnproto-rust.git", rev = "1e1d5ad692b4b2c2b942f04f32550df6445f4216" }
